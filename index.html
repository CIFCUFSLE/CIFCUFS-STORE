    function normalizeFirestoreTimestamp(ts) {
      if (!ts) return null;
      if (typeof ts.toDate === 'function') return ts.toDate().toISOString();
      if (typeof ts.seconds === 'number') return new Date(ts.seconds * 1000).toISOString();
      return ts;
    }

    function initRealtimeFirestoreSync() {
      if (!firestoreDB) return;

      // 1. Sinkronisasi Real-Time Pesanan (Orders)
      firestoreDB.collection('orders').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
        const cloudOrders = snapshot.docs.map(doc => {
          const data = doc.data();
          const createdIso = normalizeFirestoreTimestamp(data.serverCreatedAt) || normalizeFirestoreTimestamp(data.createdAt);
          const paidIso = normalizeFirestoreTimestamp(data.serverPaidAt) || normalizeFirestoreTimestamp(data.paidAt) || null;
          return {
            id: doc.id,
            ...data,
            createdAt: createdIso || data.createdAt,
            paidAt: paidIso
          };
        });
        state.orders = cloudOrders;
        saveToStorage(STORAGE_KEYS.ORDERS, state.orders);
        if (state.activePage === 'orders' || state.activePage === 'payment' || state.activePage === 'admin') {
          renderApp();
        }
      });

      // 2. Sinkronisasi Real-Time Ulasan (Reviews)
      firestoreDB.collection('reviews').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
        const cloudReviews = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        state.reviews = cloudReviews;
        saveToStorage(STORAGE_KEYS.REVIEWS, state.reviews);
        if (state.activePage === 'home') {
          renderApp();
        }
      });

      // 3. Sinkronisasi Katalog Produk & Harga dari Admin
      firestoreDB.collection('store_config').doc('catalog').onSnapshot((doc) => {
        if (doc.exists && Array.isArray(doc.data().products)) {
          state.products = doc.data().products;
          saveToStorage(STORAGE_KEYS.PRODUCTS, state.products);
          if (['home', 'catalog', 'admin'].includes(state.activePage)) {
            renderApp();
          }
        }
      });

      // 4. Sinkronisasi Pengaturan Toko & Rekening/QRIS
      firestoreDB.collection('store_config').doc('settings').onSnapshot((doc) => {
        if (doc.exists && doc.data().settings) {
          state.settings = { ...state.settings, ...doc.data().settings };
          saveToStorage(STORAGE_KEYS.SETTINGS, state.settings);
          renderApp();
        }
      });
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        return String(str)
  .replace(/&/g, '&')
  .replace(/</g, '<')
  .replace(/>/g, '>')
  .replace(/"/g, '"')
  .replace(/'/g, ''');
        .replace(/'/g, ''');
    }

    function formatRupiah(amount) {
      if (amount === null || amount === undefined || isNaN(amount) || Number(amount) <= 0) {
        return 'Harga belum tersedia';
      }
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(Number(amount));
    }

    // Perhitungan terpusat: Harga Produk + Fee Layanan tetap Rp100
    function calculateOrderTotals(items) {
      const subtotalAmount = (items || []).reduce((sum, item) => {
        const lineTotal = item.subtotal !== undefined
          ? Number(item.subtotal)
          : Number(item.unitPrice || 0) * Number(item.quantity || 1);
        return sum + lineTotal;
      }, 0);
      const serviceFee = subtotalAmount > 0 ? SERVICE_FEE_IDR : 0;
      const totalAmount = subtotalAmount + serviceFee;
      return { subtotalAmount, serviceFee, totalAmount };
    }

    function getOrderFinancialBreakdown(order) {
      if (!order) return { subtotalAmount: 0, serviceFee: SERVICE_FEE_IDR, totalAmount: 0 };
      const itemsSum = (order.items || []).reduce((s, it) => s + Number(it.subtotal || (it.unitPrice * it.quantity) || 0), 0);
      const serviceFee = order.serviceFee !== undefined ? Number(order.serviceFee) : SERVICE_FEE_IDR;
      const subtotalAmount = order.subtotalAmount !== undefined
        ? Number(order.subtotalAmount)
        : (itemsSum > 0 ? itemsSum : Math.max(0, Number(order.totalAmount || 0) - serviceFee));
      const totalAmount = order.totalAmount !== undefined
        ? Number(order.totalAmount)
        : subtotalAmount + serviceFee;
      return { subtotalAmount, serviceFee, totalAmount };
    }

    // Format Tanggal Indonesia (Contoh: 25 November 2026) dalam zona waktu Asia/Jakarta (WIB)
    function formatOrderDateID(isoInput) {
      if (!isoInput) return '-';
      const dateObj = typeof isoInput?.toDate === 'function' ? isoInput.toDate() : new Date(isoInput);
      if (isNaN(dateObj.getTime())) return '-';
      return new Intl.DateTimeFormat('id-ID', {
        day: 'numeric',
        month: 'long',
        year: 'numeric',
        timeZone: 'Asia/Jakarta'
      }).format(dateObj);
    }

    // Format Waktu WIB 24-jam (Contoh: 14:35 WIB) dalam zona waktu Asia/Jakarta
    function formatOrderTimeWIB(isoInput) {
      if (!isoInput) return '-';
      const dateObj = typeof isoInput?.toDate === 'function' ? isoInput.toDate() : new Date(isoInput);
      if (isNaN(dateObj.getTime())) return '-';
      const parts = new Intl.DateTimeFormat('id-ID', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
        timeZone: 'Asia/Jakarta'
      }).formatToParts(dateObj);
      const hour = parts.find(p => p.type === 'hour')?.value || '00';
      const minute = parts.find(p => p.type === 'minute')?.value || '00';
      return `${hour}:${minute} WIB`;
    }

    // Validasi status verifikasi pembayaran sebelum menampilkan Tanggal Pembayaran
    function isOrderPaymentVerified(order) {
      if (!order) return false;
      const verifiedStatuses = ['Paid', 'In Progress', 'Revision', 'Completed'];
      return verifiedStatuses.includes(order.status) && Boolean(order.paidAt || order.serverPaidAt);
    }

    function renderOrderTimestampRows(order) {
      const createdSource = order.serverCreatedAt || order.createdAt;
      const orderDateStr = formatOrderDateID(createdSource);
      const orderTimeStr = formatOrderTimeWIB(createdSource);
      const verified = isOrderPaymentVerified(order);
      const paidSource = order.serverPaidAt || order.paidAt;

      return `
        <div class="order-detail-meta space-y-1.5 text-xs">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[#4e6355]">Tanggal Pesanan:</span>
            <span class="font-semibold text-[#181f1a]">${escapeHtml(orderDateStr)}</span>
          </div>
          <div class="flex items-center justify-between gap-2">
            <span class="text-[#4e6355]">Waktu Pesanan:</span>
            <span class="font-semibold text-[#181f1a]">${escapeHtml(orderTimeStr)}</span>
          </div>
          ${verified ? `
            <div class="flex items-center justify-between gap-2">
              <span class="text-[#4e6355]">Tanggal Pembayaran:</span>
              <span class="font-semibold text-emerald-700">${escapeHtml(formatOrderDateID(paidSource))}</span>
            </div>
          ` : `
            <div class="flex items-center justify-between gap-2">
              <span class="text-[#4e6355]">Status Pembayaran:</span>
              <span class="font-semibold text-amber-800">Menunggu Pembayaran</span>
            </div>
          `}
        </div>
      `;
    }

    function getVariantEffectivePrice(variant) {
      if (!variant) return null;
      const base = variant.promoPrice !== null && Number(variant.promoPrice) > 0
        ? Number(variant.promoPrice)
        : (variant.basePrice !== null && Number(variant.basePrice) > 0 ? Number(variant.basePrice) : null);
      if (base === null) return null;
      return base + Number(variant.extraFee || 0);
    }

    function getProductStartingPrice(product) {
      if (!product || !Array.isArray(product.variants)) return null;
      const valid = product.variants.map(getVariantEffectivePrice).filter((p) => p !== null && p > 0);
      if (valid.length === 0) return null;
      return Math.min(...valid);
    }

    const PAYMENT_TIMEOUT_MS = 60 * 60 * 1000; // Batas waktu pembayaran 1 jam (60 menit)

    function getOrderPaymentDeadline(order) {
      if (!order) return 0;
      if (order.paymentDeadline) return new Date(order.paymentDeadline).getTime();
      return new Date(order.createdAt).getTime() + PAYMENT_TIMEOUT_MS;
    }

    function formatRemainingCountdown(ms) {
      if (ms <= 0) return '00:00:00';
      const totalSec = Math.floor(ms / 1000);
      const hrs = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const mins = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const secs = String(totalSec % 60).padStart(2, '0');
      return `${hrs}:${mins}:${secs}`;
    }

    function checkAndExpireUnpaidOrders() {
      const now = Date.now();
      let hasChanges = false;

      state.orders = state.orders.map((o) => {
        if (o.status === 'Waiting for Payment' && now >= getOrderPaymentDeadline(o)) {
          hasChanges = true;
          const updatedAt = new Date().toISOString();
          updateOrderInDB(o.id, {
            status: 'Cancelled',
            cancelReason: 'Otomatis dibatalkan (melewati batas waktu pembayaran 1 jam)',
            updatedAt
          });
          return {
            ...o,
            status: 'Cancelled',
            cancelReason: 'Otomatis dibatalkan (melewati batas waktu pembayaran 1 jam)',
            updatedAt
          };
        }
        return o;
      });

      if (hasChanges) {
        saveToStorage(STORAGE_KEYS.ORDERS, state.orders);
        if (['payment', 'orders', 'admin'].includes(state.activePage)) {
          renderApp();
        }
      }

      document.querySelectorAll('[data-countdown-deadline]').forEach((el) => {
        const deadline = Number(el.getAttribute('data-countdown-deadline'));
        const diff = deadline - now;
        el.textContent = formatRemainingCountdown(diff);
      });
    }

        'In Progress': 'bg-[#e6efe6] text-[#2d5a3c] border-[#4a7c59]',

    function readImageFileAsDataUrl(file, callback) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          const scale = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          callback(canvas.toDataURL('image/jpeg', 0.75));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

            p.name.toLowerCase().includes(q) ||

    // =========================================================================
    // 7. MODAL DETAIL PRODUK & PILIH VARIASI BERTINGKAT (PLAN -> DURASI)
    // =========================================================================
    let modalVariantState = {
      productId: null,
      selectedPlan: '',
      selectedVariantId: '',
      quantity: 1,
      targetAccount: '',
      briefDescription: '',
      deadline: '',
      referenceFile: null
    };

    function openProductDetailModal(productId) {
      const product = state.products.find(p => p.id === productId);
      if (!product) return;
      const plans = Array.from(new Set((product.variants || []).map(v => v.plan)));
      const firstPlan = plans[0] || '';
      const firstVariant = (product.variants || []).find(v => v.plan === firstPlan) || product.variants?.[0];

      modalVariantState = {
        productId,
        selectedPlan: firstPlan,
        selectedVariantId: firstVariant?.id || '',
        quantity: 1,
        targetAccount: '',
        briefDescription: '',
        deadline: '',
        referenceFile: null
      };
      renderProductDetailModal();
    }

    function selectModalPlan(planName) {
      const product = state.products.find(p => p.id === modalVariantState.productId);
      if (!product) return;
      const match = (product.variants || []).find(v => v.plan === planName);
      modalVariantState.selectedPlan = planName;
      modalVariantState.selectedVariantId = match?.id || '';
      renderProductDetailModal();
    }

    function selectModalVariant(variantId) {
      modalVariantState.selectedVariantId = variantId;
      renderProductDetailModal();
    }

    function changeModalQty(delta) {
      modalVariantState.quantity = Math.max(1, modalVariantState.quantity + delta);
      renderProductDetailModal();
    }

    function handleServiceRefFile(input) {
      const file = input.files?.[0];
      if (!file) return;
      readImageFileAsDataUrl(file, (dataUrl) => {
        modalVariantState.referenceFile = { name: file.name, dataUrl };
        renderProductDetailModal();
      });
    }

    function renderProductDetailModal() {
      const product = state.products.find(p => p.id === modalVariantState.productId);
      if (!product) return;
      const cat = state.categories.find(c => c.id === product.categoryId);
      const uniquePlans = Array.from(new Set((product.variants || []).map(v => v.plan)));
      const variantsForPlan = (product.variants || []).filter(v => v.plan === modalVariantState.selectedPlan);
      const activeVariant = (product.variants || []).find(v => v.id === modalVariantState.selectedVariantId) || variantsForPlan[0];

      const effectivePrice = getVariantEffectivePrice(activeVariant);
      const isPriceReady = effectivePrice !== null && effectivePrice > 0;
      const isOutOfStock = activeVariant?.stock === 'Habis';
      const s = state.settings;
      const waClean = s.whatsappRaw || s.whatsappNumber.replace(/\D/g, '').replace(/^0/, '62');

      document.getElementById('modal-root').innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/55 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
          <div class="bg-white border border-[#d5e3d6] rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl my-8 animate-fade-in">
            <div class="px-6 py-4 bg-[#f4f7f4] border-b border-[#d5e3d6] flex items-center justify-between">
              <div>
                <span class="text-[11px] font-bold uppercase tracking-wider text-[#4a7c59]">${escapeHtml(product.subcategory || cat?.name || '')}</span>
                <h2 class="product-title text-xl font-bold text-[#181f1a]">${escapeHtml(product.name)}</h2>
              </div>
              <button onclick="closeModal()" class="p-2 rounded-xl hover:bg-[#e6efe6] text-[#43574a]">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            <div class="p-6 space-y-5 max-h-[80vh] overflow-y-auto">
              <div class="space-y-2">
                <p class="text-xs sm:text-sm text-[#4e6355] leading-relaxed">${escapeHtml(product.description)}</p>
                ${product.isService ? `

    function confirmAddVariantToCart() {
      const product = state.products.find(p => p.id === modalVariantState.productId);
      if (!product) return;
      const variant = (product.variants || []).find(v => v.id === modalVariantState.selectedVariantId);
      const effectivePrice = getVariantEffectivePrice(variant);
      if (!variant || effectivePrice === null || effectivePrice <= 0 || variant.stock === 'Habis') {
        showToast('Harga atau stok variasi tidak tersedia.', 'error');
        return;
      }

      const cat = state.categories.find(c => c.id === product.categoryId);
      const customBrief = (product.isService || product.requiresTargetInput)
        ? {
            targetAccount: modalVariantState.targetAccount.trim(),
            briefDescription: modalVariantState.briefDescription.trim(),
            deadline: modalVariantState.deadline,
            referenceFile: modalVariantState.referenceFile
          }
        : null;

      const key = `${product.id}__${variant.id}__${Date.now()}`;
      const existingIdx = !product.isService && !product.requiresTargetInput
        ? state.cart.findIndex(i => i.productId === product.id && i.variantId === variant.id)
        : -1;

      if (existingIdx > -1) {
        state.cart[existingIdx].quantity += modalVariantState.quantity;
      } else {
        state.cart.push({
          key,
          productId: product.id,
          productName: product.name,
          categoryName: cat?.name || '',
          subcategory: product.subcategory || '',
          variantId: variant.id,
          plan: variant.plan,
          duration: variant.duration,
          quantity: modalVariantState.quantity,
          unitPrice: effectivePrice,
          customBrief
        });
      }

      saveToStorage(STORAGE_KEYS.CART, state.cart);
      closeModal();
      renderTopAndNavbar();
      openCartDrawer();
      showToast(`${product.name} (${variant.plan}) ditambahkan ke keranjang!`);
    }

    function updateCartItemQty(key, delta) {
      state.cart = state.cart
        .map(item => item.key === key ? { ...item, quantity: Math.max(0, item.quantity + delta) } : item)
        .filter(item => item.quantity > 0);
      saveToStorage(STORAGE_KEYS.CART, state.cart);
      renderTopAndNavbar();
      openCartDrawer();
    }

    function removeCartItem(key) {
      state.cart = state.cart.filter(item => item.key !== key);
      saveToStorage(STORAGE_KEYS.CART, state.cart);
      renderTopAndNavbar();
      openCartDrawer();
    }

    function submitCheckoutOrder(e) {
      e.preventDefault();
      const customerName = document.getElementById('chk-name').value.trim();
      const customerWhatsapp = document.getElementById('chk-wa').value.trim();
      const paymentMethod = document.getElementById('chk-method').value;
      const customerNotes = document.getElementById('chk-notes').value.trim();

      if (!customerName || !customerWhatsapp) {
        showToast('Nama dan nomor WhatsApp wajib diisi.', 'error');
        return;
      }

      // Validasi ulang harga langsung dari state.products (mencegah manipulasi browser)
      const validatedItems = [];
      for (const item of state.cart) {
        const dbProd = state.products.find(p => p.id === item.productId && p.active);
        const dbVar = dbProd?.variants?.find(v => v.id === item.variantId);
        const validPrice = getVariantEffectivePrice(dbVar);
        if (!dbProd || !dbVar || validPrice === null || validPrice <= 0 || dbVar.stock === 'Habis') {
          showToast(`Harga atau stok produk ${item.productName} telah diperbarui. Periksa kembali keranjang Anda.`, 'error');
          return;
        }
        validatedItems.push({
          ...item,
          unitPrice: validPrice,
          subtotal: validPrice * item.quantity
        });
      }

      // Hitung otomatis Harga Produk + Fee Layanan Rp100
      const { subtotalAmount, serviceFee, totalAmount } = calculateOrderTotals(validatedItems);
      const now = new Date();
      const orderNumber = `GS-${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${Math.floor(1000 + Math.random() * 9000)}`;

      const newOrder = {
        id: orderNumber,
        orderNumber,
        customerName,
        customerWhatsapp,
        customerNotes,
        items: validatedItems,
        subtotalAmount,
        serviceFee,
        totalAmount,
        paymentMethod,
        paymentProofImage: '',
        status: 'Waiting for Payment',
        paymentDeadline: new Date(now.getTime() + PAYMENT_TIMEOUT_MS).toISOString(),
        createdAt: now.toISOString(),
        paidAt: null,
        updatedAt: now.toISOString()
      };

      state.orders.unshift(newOrder);
      saveToStorage(STORAGE_KEYS.ORDERS, state.orders);
      saveOrderToDB(newOrder);

      if (!state.userProfile.name || !state.userProfile.whatsapp) {
        state.userProfile.name = state.userProfile.name || customerName;
        state.userProfile.whatsapp = state.userProfile.whatsapp || customerWhatsapp;
        saveToStorage(STORAGE_KEYS.USER_PROFILE, state.userProfile);
      }

      state.cart = [];
      saveToStorage(STORAGE_KEYS.CART, state.cart);
      closeModal();

      state.activePaymentOrderId = orderNumber;
      state.activePage = 'payment';
      renderApp();
      showToast(`Pesanan ${orderNumber} berhasil dibuat!`);

    // =========================================================================

    let tempPaymentMethod = null;
    let tempProofDataUrl = '';

            <div class="flex flex-col sm:flex-row gap-3 pt-2">

    function selectPaymentMethod(method) {
      tempPaymentMethod = method;
      renderApp();
    }

    function handlePaymentProofFile(input) {
      const file = input.files?.[0];
      if (!file) return;
      readImageFileAsDataUrl(file, (dataUrl) => {
        tempProofDataUrl = dataUrl;
        renderApp();
      });
    }

    function confirmOrderPayment(orderId) {
      const idx = state.orders.findIndex(o => o.id === orderId);
      if (idx === -1) return;
      const proof = tempProofDataUrl || state.orders[idx].paymentProofImage;
      if (!proof) {
        showToast('Silakan unggah bukti transfer terlebih dahulu.', 'error');
        return;
      }

      state.orders[idx] = {
        ...state.orders[idx],
        paymentMethod: tempPaymentMethod || state.orders[idx].paymentMethod || 'QRIS',
        paymentProofImage: proof,
        status: 'Waiting for Verification',
        updatedAt: new Date().toISOString()
      };
      saveToStorage(STORAGE_KEYS.ORDERS, state.orders);
      updateOrderInDB(orderId, {
        paymentMethod: state.orders[idx].paymentMethod,
        paymentProofImage: proof,
        status: 'Waiting for Verification',
        updatedAt: state.orders[idx].updatedAt
      });

      tempPaymentMethod = null;
      tempProofDataUrl = '';
      showToast('Bukti transfer terkirim! Status: Waiting for Verification.');
      navigateTo('orders');
    }

        tempProfileAvatar = dataUrl;
        const preview = document.getElementById('profile-avatar-preview');
        if (preview) {
          preview.innerHTML = `<img src="${dataUrl}" alt="Avatar" class="w-24 h-24 rounded-full object-cover border-4 border-[#e6efe6]" />`;
        }
      });
    }

      e.preventDefault();

        name: document.getElementById('prof-name').value.trim(),
        whatsapp: document.getElementById('prof-wa').value.trim(),
        email: document.getElementById('prof-email').value.trim(),

    async function submitAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adm-email').value.trim();
      const pass = document.getElementById('adm-pass').value;

      if (!window.firebase || !firebase.auth) {
        showToast('SDK Firebase Auth belum dimuat. Periksa tag script di bagian head.', 'error');
        return;
      }

      try {
        await firebase.auth().signInWithEmailAndPassword(email, pass);
        state.adminAuth.isAuthenticated = true;
        state.adminAuth.email = email;
        saveToStorage(STORAGE_KEYS.ADMIN_AUTH, state.adminAuth);
        closeModal();
        navigateTo('admin');
        showToast('Berhasil masuk ke Admin Dashboard!');
      } catch (err) {
        console.error('Firebase Login Error:', err.code, err.message);
        showToast('Login gagal: ' + (err.message || 'Email atau kata sandi salah.'), 'error');
      }
    }

    function logoutAdmin() {
      state.adminAuth.isAuthenticated = false;
      saveToStorage(STORAGE_KEYS.ADMIN_AUTH, state.adminAuth);
      if (window.firebase && firebase.auth) {
        firebase.auth().signOut().catch(() => {});
      }
      navigateTo('home');
      showToast('Anda telah keluar dari Admin Dashboard.');

service cloud.firestore {

      const catId = document.getElementById('pf-cat').value;
      const orderVal = Number(document.getElementById('pf-order').value || 1);
      const subcat = document.getElementById('pf-subcat').value;
      const name = document.getElementById('pf-name').value.trim();
      const desc = document.getElementById('pf-desc').value.trim();
      const featured = document.getElementById('pf-feat').checked;
      const active = document.getElementById('pf-act').checked;

      if (isEdit) {
        state.products = state.products.map(p => p.id === prodId ? {
          ...p,
          categoryId: catId,
          subcategory: subcat,
          name,
          description: desc,
          image: tempProductImage,
          order: orderVal,
          featured,
          active,
          isService: catId === 'jasa-edit-tugas',
          requiresTargetInput: catId === 'social-media'
        } : p);
      } else {
        state.products.push({
          id: prodId,
          categoryId: catId,
          subcategory: subcat || (catId === 'jasa-edit-tugas' ? 'Jasa Edit' : ''),
          name,
          description: desc,
          image: tempProductImage,
          order: orderVal,
          featured,
          active,

          requiresTargetInput: catId === 'social-media',
          targetLabel: catId === 'social-media' ? 'Username / Link Target' : '',

      syncCatalogToCloud();
      closeModal();

    function saveAdminProductPrices(prodId) {
      state.products = state.products.map(p => {
        if (p.id !== prodId) return p;
        const updatedVars = (p.variants || []).map(v => {
          const baseEl = document.getElementById(`price-base-${v.id}`);
          const promoEl = document.getElementById(`price-promo-${v.id}`);
          const extraEl = document.getElementById(`price-extra-${v.id}`);

          const baseVal = baseEl && baseEl.value !== '' && Number(baseEl.value) > 0 ? Number(baseEl.value) : null;
          const promoVal = promoEl && promoEl.value !== '' && Number(promoEl.value) > 0 ? Number(promoEl.value) : null;
          const extraVal = extraEl && extraEl.value !== '' ? Number(extraEl.value) : 0;

          return { ...v, basePrice: baseVal, promoPrice: promoVal, extraFee: extraVal };
        });
        return { ...p, variants: updatedVars };
      });

      saveToStorage(STORAGE_KEYS.PRODUCTS, state.products);
      syncCatalogToCloud();
      renderApp();
      showToast('Harga variasi berhasil disimpan & langsung tampil di katalog!');
    }

    function updateAdminOrderStatus(orderId, newStatus) {
      const nowIso = new Date().toISOString();
      const verifiedStatuses = ['Paid', 'In Progress', 'Revision', 'Completed'];

      state.orders = state.orders.map(o => {
        if (o.id !== orderId) return o;
        let nextPaidAt = o.paidAt || null;
        if (newStatus === 'Paid' || (verifiedStatuses.includes(newStatus) && !nextPaidAt)) {
          nextPaidAt = nowIso;
        } else if (!verifiedStatuses.includes(newStatus)) {
          nextPaidAt = null;
        }
        return {
          ...o,
          status: newStatus,
          paidAt: nextPaidAt,
          updatedAt: nowIso
        };
      });

      saveToStorage(STORAGE_KEYS.ORDERS, state.orders);

      const targetOrder = state.orders.find(o => o.id === orderId);
      const dbPatch = {
        status: newStatus,
        paidAt: targetOrder?.paidAt || null,
        updatedAt: nowIso
      };
      if (!verifiedStatuses.includes(newStatus)) {
        dbPatch.serverPaidAt = null;
      }
      updateOrderInDB(orderId, dbPatch);

      renderApp();
      showToast(`Status pesanan diperbarui ke "${newStatus}".`);
    }

    function handleWebsiteAssetUpload(field, input) {
      const file = input.files?.[0];
      if (!file) return;
      const maxW = field === 'heroBannerImage' ? 1400 : 800;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const scale = img.width > maxW ? maxW / img.width : 1;
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.82);

          if (field === 'adminAvatar') {
            state.adminAuth.adminAvatar = dataUrl;
            saveToStorage(STORAGE_KEYS.ADMIN_AUTH, state.adminAuth);
          } else {
            state.settings[field] = dataUrl;
            saveToStorage(STORAGE_KEYS.SETTINGS, state.settings);
            syncSettingsToCloud();
          }
          renderApp();
          showToast('Gambar berhasil diperbarui & tersimpan ke cloud.');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function submitCustomerReview(e) {
      e.preventDefault();
      const name = document.getElementById('rev-name').value.trim();
      const orderNum = document.getElementById('rev-order-num').value.trim();
      const service = document.getElementById('rev-service').value;
      const reviewText = document.getElementById('rev-text').value.trim();

      if (!name || !reviewText) {
        showToast('Nama dan isi ulasan wajib diisi.', 'error');
        return;
      }

      const matchedOrder = orderNum
        ? state.orders.find(o => o.orderNumber.toLowerCase() === orderNum.toLowerCase())
        : null;

      const newReview = {
        id: `rev-${Date.now()}`,
        name,
        service,
        rating: state.reviewRatingInput || 5,
        review: reviewText,
        verifiedOrder: Boolean(matchedOrder),
        createdAt: new Date().toISOString()
      };

      state.reviews.unshift(newReview);
      saveToStorage(STORAGE_KEYS.REVIEWS, state.reviews);
      saveReviewToDB(newReview);

      closeModal();
      renderApp();
      showToast('Terima kasih! Ulasan Anda langsung ditampilkan.');
    }

      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderApp();

    function setAdminMenu(menuId) {

    function closeModal() {
      document.getElementById('modal-root').innerHTML = '';
    }

    function renderApp() {
      renderTopAndNavbar();
      const mainEl = document.getElementById('app-main');
      switch (state.activePage) {
        case 'catalog':
          mainEl.innerHTML = renderCatalogPage();
          break;
        case 'orders':
          mainEl.innerHTML = renderOrdersPage();
          break;
        case 'about':
          mainEl.innerHTML = renderAboutPage();
          break;
        case 'payment':
          mainEl.innerHTML = renderPaymentPage();
          break;
        case 'admin':
          mainEl.innerHTML = renderAdminDashboard();
          break;
        case 'home':
        default:
          mainEl.innerHTML = renderHomePage();
          break;
      }
      if (window.lucide) lucide.createIcons();
    }

    function checkAdminRedirectRoute() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('admin') === '1' || window.location.hash === '#admin') {
        history.replaceState(null, '', window.location.pathname);
        if (state.adminAuth.isAuthenticated) {
          navigateTo('admin');
        } else {
          openAdminLoginModal();
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.firebase && firebase.auth) {
        firebase.auth().onAuthStateChanged((user) => {
          state.adminAuth.isAuthenticated = Boolean(user);
          if (user) state.adminAuth.email = user.email;
          saveToStorage(STORAGE_KEYS.ADMIN_AUTH, state.adminAuth);
          renderApp();
        });
      }
      checkAndExpireUnpaidOrders();
      setInterval(checkAndExpireUnpaidOrders, 1000);
      renderApp();
      initRealtimeFirestoreSync();
      checkAdminRedirectRoute();
    });
