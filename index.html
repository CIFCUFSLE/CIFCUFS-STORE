    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"')
        .replace(/'/g, ''');
    }

    function formatRupiah(amount) {
      if (amount === null || amount === undefined || isNaN(amount) || Number(amount) <= 0) {
        return 'Harga belum tersedia';
      }
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(Number(amount));
    }

    function getVariantEffectivePrice(variant) {
      if (!variant) return null;
      const base = variant.promoPrice !== null && Number(variant.promoPrice) > 0
        ? Number(variant.promoPrice)
        : (variant.basePrice !== null && Number(variant.basePrice) > 0 ? Number(variant.basePrice) : null);
      if (base === null) return null;
      return base + Number(variant.extraFee || 0);
    }

    function getProductStartingPrice(product) {
      if (!product || !Array.isArray(product.variants)) return null;
      const valid = product.variants.map(getVariantEffectivePrice).filter((p) => p !== null && p > 0);
      if (valid.length === 0) return null;
      return Math.min(...valid);
    }

    // Kompresi gambar otomatis agar muat di Firestore (<1MB) & localStorage
    function readImageFileAsDataUrl(file, callback) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        if (!file.type.startsWith('image/')) {
          callback(e.target.result);
          return;
        }
        const img = new Image();
        img.onload = () => {
          const MAX_DIM = 900;
          let { width, height } = img;
          if (width > MAX_DIM || height > MAX_DIM) {
            if (width > height) {
              height = Math.round((height * MAX_DIM) / width);
              width = MAX_DIM;
            } else {
              width = Math.round((width * MAX_DIM) / height);
              height = MAX_DIM;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = () => callback(e.target.result);
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // =========================================================================
    // 7. MODAL DETAIL PRODUK & PILIH VARIASI BERTINGKAT (PLAN -> DURASI)
    // =========================================================================
    let modalVariantState = {
      productId: null,
      selectedPlan: '',
      selectedVariantId: '',
      quantity: 1,
      targetAccount: '',
      briefDescription: '',
      deadline: '',
      referenceFile: null
    };

    function openProductDetailModal(productId) {
      const product = state.products.find(p => p.id === productId);
      if (!product) return;
      const plans = Array.from(new Set((product.variants || []).map(v => v.plan)));
      const firstPlan = plans[0] || '';
      const firstVariant = (product.variants || []).find(v => v.plan === firstPlan) || product.variants?.[0];

      modalVariantState = {
        productId,
        selectedPlan: firstPlan,
        selectedVariantId: firstVariant?.id || '',
        quantity: 1,
        targetAccount: '',
        briefDescription: '',
        deadline: '',
        referenceFile: null
      };
      renderProductDetailModal();
    }

    function selectModalPlan(planName) {
      const product = state.products.find(p => p.id === modalVariantState.productId);
      if (!product) return;
      const match = (product.variants || []).find(v => v.plan === planName);
      modalVariantState.selectedPlan = planName;
      modalVariantState.selectedVariantId = match?.id || '';
      renderProductDetailModal();
    }

    function selectModalVariant(variantId) {
      modalVariantState.selectedVariantId = variantId;
      renderProductDetailModal();
    }

    function changeModalQty(delta) {
      modalVariantState.quantity = Math.max(1, modalVariantState.quantity + delta);
      renderProductDetailModal();
    }

    function handleServiceRefFile(input) {
      const file = input.files?.[0];
      if (!file) return;
      readImageFileAsDataUrl(file, (dataUrl) => {
        modalVariantState.referenceFile = { name: file.name, dataUrl };
        renderProductDetailModal();
      });
    }

    function renderProductDetailModal() {
      const product = state.products.find(p => p.id === modalVariantState.productId);
      if (!product) return;
      const cat = state.categories.find(c => c.id === product.categoryId);
      const uniquePlans = Array.from(new Set((product.variants || []).map(v => v.plan)));
      const variantsForPlan = (product.variants || []).filter(v => v.plan === modalVariantState.selectedPlan);
      const activeVariant = (product.variants || []).find(v => v.id === modalVariantState.selectedVariantId) || variantsForPlan[0];

      const effectivePrice = getVariantEffectivePrice(activeVariant);
      const isPriceReady = effectivePrice !== null && effectivePrice > 0;
      const isOutOfStock = activeVariant?.stock === 'Habis';
      const s = state.settings;
      const waClean = s.whatsappRaw || s.whatsappNumber.replace(/\D/g, '').replace(/^0/, '62');

      document.getElementById('modal-root').innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/55 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">

              </div>
              <button onclick="closeModal()" class="p-2 rounded-xl hover:bg-[#e6efe6] text-[#43574a]">

            </div>

            <div class="p-6 space-y-5 max-h-[80vh] overflow-y-auto">
              <div class="space-y-2">
                <p class="text-xs sm:text-sm text-[#4e6355] leading-relaxed">${escapeHtml(product.description)}</p>
                ${product.isService ? `
                  <div class="flex flex-wrap gap-2 pt-1">
                    <span class="px-3 py-1 rounded-lg bg-[#e6efe6] text-[#2d5a3c] text-xs font-bold">Tingkat Kesulitan: ${escapeHtml(product.difficulty || 'Menengah')}</span>
                    <span class="px-3 py-1 rounded-lg bg-[#e6efe6] text-[#2d5a3c] text-xs font-bold">Estimasi Pengerjaan: ${escapeHtml(product.estimatedTime || '1 - 2 Hari')}</span>
                  </div>

              </div>

              ${!product.singleOptionMode && uniquePlans.length > 0 ? `
                <div class="space-y-2">

                    ${uniquePlans.map(plan => `
                      <button type="button" onclick="selectModalPlan('${escapeHtml(plan).replace(/'/g, "\\'")}')" class="px-3.5 py-2.5 rounded-xl border text-xs font-bold text-left transition-all ${
                        modalVariantState.selectedPlan === plan
                          ? 'border-[#2d5a3c] bg-[#2d5a3c] text-white shadow-2xs'

              <div class="space-y-2">
                <label class="block text-xs font-bold uppercase tracking-wider text-[#2d5a3c]">
                  ${product.singleOptionMode ? 'Paket Tersedia' : '2. Pilih Durasi / Variasi'}

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  ${variantsForPlan.map(v => {
                    const vp = getVariantEffectivePrice(v);
                    const selected = activeVariant?.id === v.id;
                    return `
                      <button type="button" onclick="selectModalVariant('${v.id}')" class="p-3.5 rounded-xl border text-left transition-all flex items-center justify-between gap-2 ${
                        selected ? 'border-[#2d5a3c] bg-[#e6efe6] ring-1 ring-[#2d5a3c]' : 'border-[#d5e3d6] bg-white hover:border-[#4a7c59]'
                      }">
                        <div>
                          <p class="text-xs font-extrabold text-[#181f1a]">${escapeHtml(product.singleOptionMode ? v.plan : v.duration)}</p>
                          <p class="text-[11px] text-[#4e6355] mt-0.5">Stok: <strong class="${v.stock === 'Habis' ? 'text-[#d94e4e]' : 'text-[#2d5a3c]'}">${escapeHtml(v.stock || 'Tersedia')}</strong></p>
                        </div>
                        <span class="text-xs font-extrabold ${vp ? 'text-[#2d5a3c]' : 'text-[#d94e4e]'}">${formatRupiah(vp)}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>

              ${activeVariant && Number(activeVariant.extraFee) > 0 ? `
                <div class="p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-900 flex items-center justify-between">
                  <span>${escapeHtml(activeVariant.extraFeeNote || 'Biaya tambahan paket')}</span>
                  <span class="font-bold">+${formatRupiah(activeVariant.extraFee)}</span>
                </div>
              ` : ''}

              ${product.requiresTargetInput ? `
                <div class="space-y-1.5">
                  <label class="block text-xs font-bold text-[#181f1a]">${escapeHtml(product.targetLabel || 'Username / Link Target')}</label>
                  <input type="text" value="${escapeHtml(modalVariantState.targetAccount)}" oninput="modalVariantState.targetAccount = this.value" placeholder="${escapeHtml(product.targetPlaceholder || '')}" class="w-full px-3.5 py-2.5 rounded-xl border border-[#d5e3d6] text-sm focus:border-[#4a7c59] focus:outline-none" />
                </div>
              ` : ''}

              ${product.isService ? `
                <div class="space-y-3.5 p-4 rounded-2xl bg-[#f4f7f4] border border-[#d5e3d6]">
                  <h4 class="text-xs font-extrabold uppercase tracking-wider text-[#2d5a3c]">Form Brief Layanan & File Referensi</h4>
                  <div>
                    <label class="block text-xs font-semibold mb-1">Instruksi / Brief Kebutuhan</label>

                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-semibold mb-1">Target Deadline</label>
                      <input type="date" value="${escapeHtml(modalVariantState.deadline)}" onchange="modalVariantState.deadline = this.value" class="w-full px-3.5 py-2 rounded-xl border border-[#d5e3d6] bg-white text-xs" />

                      <label class="block text-xs font-semibold mb-1">Upload File Referensi (Opsional)</label>
                      <label class="flex items-center justify-center gap-2 px-3.5 py-2 rounded-xl border border-dashed border-[#4a7c59] bg-white hover:bg-[#e6efe6] cursor-pointer text-xs font-bold text-[#2d5a3c]">

                        <span class="truncate">${modalVariantState.referenceFile ? escapeHtml(modalVariantState.referenceFile.name) : 'Pilih File / Gambar'}</span>
                        <input type="file" onchange="handleServiceRefFile(this)" class="hidden" />
                      </label>
                    </div>
                  </div>
                </div>

              <div class="p-4 rounded-2xl bg-[#e6efe6] border border-[#c6dec9] flex flex-wrap items-center justify-between gap-4">

                  <span class="text-xs font-semibold text-[#43574a]">Total Harga Variasi</span>
                  <div class="flex items-baseline gap-2 mt-0.5">
                    <span class="text-xl font-extrabold ${isPriceReady ? 'text-[#181f1a]' : 'text-[#d94e4e]'}">

                    </span>
                    ${activeVariant?.promoPrice && activeVariant?.basePrice ? `
                      <span class="text-xs line-through text-[#5e7365]">${formatRupiah(Number(activeVariant.basePrice) + Number(activeVariant.extraFee || 0))}</span>

                ${isPriceReady ? `

                    <span class="text-xs font-bold text-[#2d5a3c]">Jumlah:</span>

                      <button type="button" onclick="changeModalQty(-1)" class="px-3 py-1.5 font-bold text-[#2d5a3c] hover:bg-[#f4f7f4]">-</button>
                      <span class="px-3 py-1.5 text-xs font-extrabold">${modalVariantState.quantity}</span>
                      <button type="button" onclick="changeModalQty(1)" class="px-3 py-1.5 font-bold text-[#2d5a3c] hover:bg-[#f4f7f4]">+</button>
                    </div>
                  </div>
                ` : ''}
              </div>

              ${!isPriceReady ? `
                <div class="space-y-2.5">
                  <button type="button" disabled class="w-full py-3.5 rounded-xl bg-stone-200 text-stone-500 font-bold text-xs sm:text-sm cursor-not-allowed">
                    Harga belum tersedia — Tidak dapat ditambahkan ke keranjang
                  </button>
                  <a href="https://wa.me/${escapeHtml(waClean)}?text=${encodeURIComponent(`Halo Admin CIFCUFS STORE, saya ingin menanyakan harga untuk produk *${product.name}* variasi *${activeVariant?.plan} - ${activeVariant?.duration}*.`)}" target="_blank" rel="noreferrer" class="w-full py-3 rounded-xl border border-[#2d5a3c] text-[#2d5a3c] hover:bg-[#e6efe6] font-bold text-xs flex items-center justify-center gap-2">

                    <span>Tanyakan Harga ke Admin WhatsApp (${escapeHtml(s.whatsappNumber)})</span>
                  </a>
                </div>
              ` : `
                <button type="button" ${isOutOfStock ? 'disabled' : ''} onclick="confirmAddVariantToCart()" class="w-full py-3.5 rounded-xl bg-[#2d5a3c] hover:bg-[#4a7c59] disabled:bg-stone-300 text-white font-bold text-sm flex items-center justify-center gap-2 shadow-sm transition-all">
                  <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                  <span>${isOutOfStock ? 'Stok Variasi Habis' : `Tambah ke Keranjang • ${formatRupiah(effectivePrice * modalVariantState.quantity)}`}</span>
                </button>
              `}
            </div>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }

    function confirmAddVariantToCart() {
      const product = state.products.find(p => p.id === modalVariantState.productId);
      if (!product) return;
      const variant = (product.variants || []).find(v => v.id === modalVariantState.selectedVariantId);
      const effectivePrice = getVariantEffectivePrice(variant);
      if (!variant || effectivePrice === null || effectivePrice <= 0 || variant.stock === 'Habis') {
        showToast('Harga atau stok variasi tidak tersedia.', 'error');
        return;
      }

      const cat = state.categories.find(c => c.id === product.categoryId);
      const customBrief = (product.isService || product.requiresTargetInput)
        ? {
            targetAccount: modalVariantState.targetAccount.trim(),
            briefDescription: modalVariantState.briefDescription.trim(),
            deadline: modalVariantState.deadline,
            referenceFile: modalVariantState.referenceFile
          }
        : null;

      const key = `${product.id}__${variant.id}__${Date.now()}`;
      const existingIdx = !product.isService && !product.requiresTargetInput
        ? state.cart.findIndex(i => i.productId === product.id && i.variantId === variant.id)
        : -1;

      if (existingIdx > -1) {
        state.cart[existingIdx].quantity += modalVariantState.quantity;
      } else {
        state.cart.push({
          key,
          productId: product.id,
          productName: product.name,
          categoryName: cat?.name || '',
          subcategory: product.subcategory || '',
          variantId: variant.id,
          plan: variant.plan,
          duration: variant.duration,
          quantity: modalVariantState.quantity,
          unitPrice: effectivePrice,
          customBrief
        });
      }

      saveToStorage(STORAGE_KEYS.CART, state.cart);
      closeModal();
      renderTopAndNavbar();
      openCartDrawer();
      showToast(`${product.name} (${variant.plan}) ditambahkan ke keranjang!`);
    }

    function updateCartItemQty(key, delta) {
      state.cart = state.cart
        .map(item => item.key === key ? { ...item, quantity: Math.max(0, item.quantity + delta) } : item)
        .filter(item => item.quantity > 0);
      saveToStorage(STORAGE_KEYS.CART, state.cart);
      renderTopAndNavbar();
      openCartDrawer();
    }

    function removeCartItem(key) {
      state.cart = state.cart.filter(item => item.key !== key);
      saveToStorage(STORAGE_KEYS.CART, state.cart);
      renderTopAndNavbar();
      openCartDrawer();

        customerName,
        customerWhatsapp,

        items: validatedItems,
        totalAmount,

        status: 'Waiting for Payment',
        createdAt: now.toISOString(),
        updatedAt: now.toISOString()
      };
